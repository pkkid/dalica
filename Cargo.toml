[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "tests/acceptance"]
# cargo-fuzz workspaces: nightly-only, outside the product graph (security.md §7.1).
exclude = ["crates/image/fuzz", "crates/meta/fuzz", "crates/faces/fuzz", "crates/fetch/fuzz"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pkkid/dalica"
authors = ["the Dalica contributors"]

# Versions of architecture.md §1, the latest stable releases on 2026-10-09. Bumping one is its own commit.
[workspace.dependencies]
# Dalica crates
dalica-core = { path = "crates/core" }
dalica-fs = { path = "crates/fs" }
dalica-image = { path = "crates/image" }
dalica-meta = { path = "crates/meta" }
dalica-sidecar = { path = "crates/sidecar" }
dalica-edit = { path = "crates/edit" }
dalica-scenes = { path = "crates/scenes" }
dalica-fetch = { path = "crates/fetch" }
dalica-faces = { path = "crates/faces" }
dalica-library = { path = "crates/library" }
dalica-thumbs = { path = "crates/thumbs" }
dalica-store = { path = "crates/store" }
dalica-scan = { path = "crates/scan" }
dalica-create = { path = "crates/create" }
dalica-engine = { path = "crates/engine" }
dalica-ui-kit = { path = "crates/ui-kit" }
dalica-ui = { path = "crates/ui" }
dalica-mcp = { path = "crates/mcp" }

# UI
egui = { version = "0.36.2", default-features = false }
# `wgpu_no_default_features`, not `wgpu`: eframe's `wgpu` turns on wgpu's defaults, which include the
# GL/EGL backend; our own `wgpu` entry below picks Metal / Vulkan / DX12. No `default_fonts`: egui's
# bundled fonts carry the Ubuntu Font Licence, and Inter is Dalica's one committed font (assets.md §4).
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features", "accesskit", "wayland", "x11"] }
egui_extras = "0.36.2"
# Metal / Vulkan / DX12 only, no GL (architecture.md §1).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
# Each user picks its backend (the app: the XDG portal only).
rfd = { version = "0.17.2", default-features = false }
# The macOS menu bar only (apps/dalica); no GTK backend (it links C, architecture.md §1).
muda = { version = "0.21.2", default-features = false }

# Decoding, encoding, colour, resampling
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "webp", "gif", "bmp"] }
zune-jpeg = "0.5"
png = "0.18"
image-webp = "0.2"
# No `rayon`: decodes already run on the thumbnail workers, so the decoder stays on their thread.
jxl-oxide = { version = "0.12", default-features = false }
# Parts of the same project, already in `jxl-oxide`'s graph: `dalica-image` reads the image header
# and an embedded ICC profile's declared sizes with them before the decoder reserves the profile
# (formats/jxl.rs, M6.41). Versions follow what `jxl-oxide` 0.12 resolves.
jxl-bitstream = "1.1"
jxl-coding = "1.0.1"
jxl-oxide-common = "1.0"
# HEIF/HEIC behind `dalica-image`'s non-default `heif` feature (formats.md §3). Pinned exactly: a
# young decoder of untrusted files; moving the pin is a reviewed change. No `parallel` (rayon):
# Dalica decodes on its own worker threads.
heic-rs = { version = "=0.1.1", default-features = false, features = ["std"] }
moxcms = "0.9"
fast_image_resize = "6"
# The export watermark's glyphs (dalica-create, M8.11; as LightCraft): Inter outlines and their
# coverage, pure Rust (Apache-2.0; ttf-parser MIT OR Apache-2.0). No `variable-fonts`: Inter is static.
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
# Test files (`dalica-scenes` formats, M5.2): zlib for Deflate TIFF strips (already under `png`), a
# safe lossless JPEG XL encoder (MIT OR Apache-2.0 OR Zlib; single-threaded, so its bytes are
# deterministic) with its core types, and `image`'s own TIFF backend for layouts `image` refuses.
fdeflate = "0.3"
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
tiff = "0.11"

# The face models' interpreter (dalica-faces, M13.6; faces.md §2): safe matrix views over
# `matrixmultiply`'s single-threaded float32 GEMM (pure Rust, intrinsics chosen at run time, AVX-512
# included; no BLAS, no `rayon`, no `threading` feature). As LightCraft `crates/faces` (MIT OR
# Apache-2.0). Its build script only probes the rustc version (`autocfg`, already in the graph).
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
matrixmultiply = { version = "0.3.11", default-features = false, features = ["std", "avx512"] }

# Metadata, files, locations
quick-xml = "0.42"
# The IPTC digest (Photoshop resource 0x0425) in dalica-meta: RFC 1321 in one safe file, no
# dependencies, no build script (MIT OR Apache-2.0).
md5 = { version = "0.8.1", default-features = false }
# The SHA-256 a download is pinned to (dalica-fetch, M13.8; as LightCraft): RustCrypto, pure Rust,
# no `asm` feature (MIT OR Apache-2.0).
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
# The HTTPS transport (dalica-fetch, M13.13; reserved decision 9, decided 2026-10-18; as LightCraft):
# rustls without its default `aws-lc-rs` provider, over the RustCrypto provider (pure Rust, no
# `ring`), with Mozilla's root certificates compiled in (security.md §8.2). rustls and
# rustls-rustcrypto: MIT OR Apache-2.0 (rustls also ISC); webpki-roots: CDLA-Permissive-2.0, a
# reviewed licence exception (xtask/src/deps.rs).
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "1"
notify = "8"
trash = "5.2"
# The local time of a freedesktop trash record (`DeletionDate`) that dalica-fs writes itself for a
# name too long for the trash crate's record (Linux and the BSDs); already in the graph through
# `trash`, with the same features (MIT OR Apache-2.0).
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
tempfile = "3"
directories = "6"
# Writes relative to a held folder handle (dalica-fs, Unix only; security.md §5.6). Safe API only.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
# A file's volume serial number and file index on Windows (dalica-fs `Identity`, security.md §5.2):
# a safe wrapper over `GetFileInformationByHandle`; already in the graph through walkdir/same-file.
winapi-util = "0.1.11"

# Parallelism, serialization, errors, logging
rayon = "1.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Packaging: the Windows icon and VERSIONINFO of dalica.exe (apps/dalica/build.rs, only when
# targeting Windows; it runs the Windows SDK's rc.exe, compiles no C). As LightCraft and PhotoCraft.
winresource = { version = "0.1.34", default-features = false }

# Automation
rmcp = "3.5"
# The control token: 256 bits from the OS random source (already in the tree through tempfile).
getrandom = "0.4"

# Tests and benches
proptest = "1.11"
insta = { version = "1.49", features = ["json"] }
criterion = "0.8"
# Counts the allocations a closure makes on its own thread, through a global allocator it installs
# (dalica-image's `tests/jxl.rs` only). No dependencies, no build script; its `unsafe` is the
# allocator's, forwarding to `System` (MIT OR Apache-2.0).
allocation-counter = "0.8.1"

[profile.dev]
panic = "unwind"
# Keeps the target directories of 8 parallel agents small: backtraces keep file:line in our crates,
# and dependencies carry no debug info (their frames keep function names). `cargo test --workspace
# --no-run` in a fresh target dir, 2026-10-13: full debug info 49.9 GB, line tables everywhere
# 22.2 GB, line tables in workspace crates only 16.6 GB. Test builds inherit this profile.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "unwind"

# Test photos are generated in every test run: optimise their generator and encoders even in dev
# builds (a 200-photo demo library: 9.3 s unoptimised).
[profile.dev.package.dalica-scenes]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
# Decoding and resizing in tests (thumbnails of 24 MP scenes, 200-photo libraries).
[profile.dev.package.dalica-image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
# The inflate/deflate and checksum code under `png` and the JPEG decoder's core (screenshots,
# fingerprints and thumbnails decoded in tests).
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
# Headless UI tests draw thousands of frames: egui's layout and tessellation, and the CPU rasterizer
# behind every screenshot and fingerprint (`dalica-ui-kit`; `layout.rs` 26 → 3 s).
[profile.dev.package.egui]
opt-level = 3
[profile.dev.package.epaint]
opt-level = 3
[profile.dev.package.emath]
opt-level = 3
[profile.dev.package.ecolor]
opt-level = 3
[profile.dev.package.dalica-ui-kit]
opt-level = 3
# The thumbnail ladder: `image`'s generic JPEG encoder is compiled into this crate, so it runs at this
# crate's level (a scanned 10 k library: 18 → 8 s).
[profile.dev.package.dalica-thumbs]
opt-level = 3
# Every render, Auto Fix, Save and export in the tests runs the edit pipeline (`save_faults` 28.3 →
# 3.8 s, `suggest` 5.0 → 0.84 s, the crate's own unit tests 14.9 → 6.0 s; about 10 s more to build).
[profile.dev.package.dalica-edit]
opt-level = 3
# Only `opt-level` is raised: `debug-assertions` and `overflow-checks` stay on in every dev and test
# build, our optimised crates included (`docs/development.md` §3).
