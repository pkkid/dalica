[package]
name = "dalica-acceptance"
description = "Dalica milestone acceptance tests, run by cargo xtask accept M<n>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true

[dev-dependencies]
dalica-core.workspace = true
# Save run straight through `create` with a planted crash (`faults`), as a killed Save leaves the disk (M8).
dalica-create = { workspace = true, features = ["faults"] }
dalica-edit.workspace = true
dalica-engine.workspace = true
# Synthetic face models: a planted detector and a recogniser installed from a file (M13).
dalica-faces.workspace = true
dalica-fs = { workspace = true, features = ["faults"] }
dalica-image.workspace = true
dalica-meta.workspace = true
dalica-scan.workspace = true
dalica-scenes.workspace = true
# The legacy sidecar's and originals folder's names and the folder section, for the fixtures (M14).
dalica-sidecar.workspace = true
dalica-ui.workspace = true
# Whether this build carries the fallback faces (`fonts::CRAFT_FONTS`): the Thai window's fingerprint
# needs them (M15).
dalica-ui-kit.workspace = true
egui.workspace = true
png.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The Recycle Bin as Windows lists it, to find what the app trashed (M14).
trash.workspace = true

[[test]]
name = "m0"
path = "m0.rs"

[[test]]
name = "m0_skeleton"
path = "m0_skeleton.rs"

[[test]]
name = "m1"
path = "m1.rs"

[[test]]
name = "m1_headless"
path = "m1_headless.rs"

[[test]]
name = "m2"
path = "m2.rs"

[[test]]
name = "m3"
path = "m3.rs"

