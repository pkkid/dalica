[package]
name = "dalica-acceptance"
description = "Dalica milestone acceptance tests, run by cargo xtask accept M<n>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true

[dev-dependencies]
dalica-core.workspace = true
# Save run straight through `create` with a planted crash (`faults`), as a killed Save leaves the disk (M8).
dalica-create = { workspace = true, features = ["faults"] }
dalica-edit.workspace = true
dalica-engine.workspace = true
dalica-fs = { workspace = true, features = ["faults"] }
dalica-image.workspace = true
dalica-meta.workspace = true
dalica-scan.workspace = true
dalica-scenes.workspace = true
dalica-ui.workspace = true
egui.workspace = true
png.workspace = true
tempfile.workspace = true

[[test]]
name = "m0"
path = "m0.rs"

[[test]]
name = "m0_skeleton"
path = "m0_skeleton.rs"

[[test]]
name = "m1"
path = "m1.rs"

[[test]]
name = "m1_headless"
path = "m1_headless.rs"

