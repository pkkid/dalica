[package]
name = "dalica-faces"
description = "Dalica L1: Face detection, alignment, embeddings and clustering on decoded RGB buffers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false

[dependencies]
# Safe matrix views over `matrixmultiply`'s single-threaded GEMM (no BLAS, no threads of its own).
ndarray.workspace = true
matrixmultiply.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
