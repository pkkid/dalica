[package]
name = "dalica-create"
description = "Dalica L3: Export (resize, quality, watermark, metadata copy), collage layout and render, slideshow sequencing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The name sanitizer and collision names (M8.13).
dalica-core.workspace = true
# Reading sources under a size limit, the export folder and its files, never replacing one (M8.2).
dalica-fs.workspace = true
# Decoding under the limits, the colour stage, resizing and the JPEG/PNG encoders (M8.6).
dalica-image.workspace = true
# The recipe and its CPU renderer (M7.2): the output pipeline renders at full size through it.
dalica-edit.workspace = true
# Metadata carried to the new file (M8.7) and the owned fields merged into it.
dalica-meta.workspace = true
# The sRGB profile embedded in an output whose source had a profile (`data-model.md` §6); already
# in the product graph under `dalica-image`.
moxcms.workspace = true
# The export watermark: Inter SemiBold's glyphs, laid out and rasterised (M8.11).
ab_glyph.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Procedural photos, their JPEG/PNG files and the pixel fingerprints of the output tests.
dalica-scenes.workspace = true
# Temporary export locations and the export plan's property tests.
tempfile.workspace = true
proptest.workspace = true
