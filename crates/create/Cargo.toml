[package]
name = "dalica-create"
description = "Dalica L3: Export (resize, quality, watermark, metadata copy), collage layout and render, slideshow sequencing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test in one binary (tests/all.rs), linked once; see tests/all.rs.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[features]
# `dalica-fs`'s named fault points, so tests can fail or "crash" every step of a Save (M8.18).
faults = ["dalica-fs/faults"]

[dependencies]
# The name sanitizer and collision names (M8.13).
dalica-core.workspace = true
# Reading sources under a size limit, the export folder and its files, never replacing one (M8.2).
dalica-fs.workspace = true
# Decoding under the limits, the colour stage, resizing and the JPEG/PNG encoders (M8.6).
dalica-image.workspace = true
# The recipe and its CPU renderer (M7.2): the output pipeline renders at full size through it.
dalica-edit.workspace = true
# Metadata carried to the new file (M8.7) and the owned fields merged into it.
dalica-meta.workspace = true
# The sRGB profile embedded in an output whose source had a profile (`data-model.md` §6); already
# in the product graph under `dalica-image`.
moxcms.workspace = true
# The export watermark: Inter SemiBold's glyphs, laid out and rasterised (M8.11).
ab_glyph.workspace = true
thiserror.workspace = true
# Save in place (M8.12; `core` and `fs` above also give it the clock's timestamps, the originals
# backup and atomic writes): the originals record's format, and its `md5:` digests.
dalica-sidecar.workspace = true
md5.workspace = true

[dev-dependencies]
# Fault points and hooks, to change a photo at the exact moment between Save's read and its move.
dalica-fs = { workspace = true, features = ["faults"] }
# Procedural photos, their JPEG/PNG files and the pixel fingerprints of the output tests.
dalica-scenes.workspace = true
# Temporary export locations and the export plan's property tests.
tempfile.workspace = true
proptest.workspace = true
# The decoder's YCbCr samples before colour conversion, to check a lossless rotation within 1 level
# (M8.14, as M8.8's tests do); already in the product graph under `dalica-image`.
zune-jpeg.workspace = true
