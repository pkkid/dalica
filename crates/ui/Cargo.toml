[package]
name = "dalica-ui"
description = "Dalica L5: The app: serialisable UiState, panels, menus and the menu catalog, shortcut dispatch, UI_COMMANDS, the headless driver and the control-method handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary (tests/all.rs) instead of one per file: one link, the tests run in parallel.
autotests = false

[features]
# The camera USB transport (`dalica-engine`'s `camera-usb`), on by default; `fuzz/` leaves it out.
default = ["camera-usb"]
camera-usb = ["dalica-engine/camera-usb"]

[dependencies]
dalica-core.workspace = true
dalica-create.workspace = true
dalica-edit.workspace = true
dalica-engine.workspace = true
dalica-fs.workspace = true
dalica-image.workspace = true
dalica-library.workspace = true
dalica-thumbs.workspace = true
dalica-ui-kit.workspace = true
egui.workspace = true
log.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
# A metadata read held in flight (`metadata_cache::planted`, `tests/properties_pane.rs`).
dalica-engine = { workspace = true, features = ["faults"] }
# Synthetic face embeddings planted in the recogniser's cache (`tests/suggestions_ui.rs`).
dalica-faces.workspace = true
# An in-memory tile server and geocoding service (`tests/map_tiles_ui.rs`): no test touches the network.
dalica-fetch.workspace = true
dalica-meta.workspace = true
dalica-scan.workspace = true
dalica-scenes.workspace = true
dalica-store.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "library_bench"
harness = false

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "slideshow"
harness = false

[[bench]]
name = "people_places"
harness = false

[[bench]]
name = "collage_canvas"
harness = false
path = "benches/collage.rs"

[[bench]]
name = "a11y_frame"
harness = false
path = "benches/a11y.rs"

[[bench]]
name = "i18n_frame"
harness = false
path = "benches/i18n.rs"
