[package]
name = "dalica-fetch"
description = "Dalica L1: Consented, resumable, hash-pinned downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false

[dependencies]
dalica-fs.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
