[package]
name = "dalica-fetch"
description = "Dalica L1: Consented, resumable, hash-pinned downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false

[dependencies]
dalica-fs.workspace = true
# the TLS crypto provider (src/http/provider.rs, ported from rustls-rustcrypto 0.0.2-alpha)
aes-gcm.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
p256.workspace = true
p384.workspace = true
rand_core.workspace = true
rsa.workspace = true
rustls.workspace = true
sha2.workspace = true
x25519-dalek.workspace = true
thiserror.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
