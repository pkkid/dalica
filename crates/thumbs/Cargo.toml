[package]
name = "dalica-thumbs"
description = "Dalica L2: The prioritised, de-duplicating job pool, the in-memory LRU and the on-disk thumbnail cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false


[dependencies]
# The renderer the ladder draws edited photos with (`ladder.rs`, architecture.md §6.3).
dalica-edit.workspace = true
dalica-fs.workspace = true
dalica-image.workspace = true
# The ladder's JPEG encoder (`ladder.rs`; already in the product through `dalica-scenes`).
image = { workspace = true, features = ["jpeg"] }
thiserror.workspace = true

[dev-dependencies]
# Pack tests arm the fault points of every pack write.
dalica-fs = { workspace = true, features = ["faults"] }
dalica-image.workspace = true
dalica-scenes.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "pack"
harness = false

[[test]]
name = "all"
path = "tests/all.rs"
