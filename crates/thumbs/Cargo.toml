[package]
name = "dalica-thumbs"
description = "Dalica L2: The prioritised, de-duplicating job pool, the in-memory LRU and the on-disk thumbnail cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false


[dependencies]
dalica-fs.workspace = true
dalica-image.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Pack tests arm the fault points of every pack write.
dalica-fs = { workspace = true, features = ["faults"] }
dalica-image.workspace = true
dalica-scenes.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "pack"
harness = false
