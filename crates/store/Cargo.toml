[package]
name = "dalica-store"
description = "Dalica L3: Persistence of the model: index journal + snapshot, model ↔ sidecar mapping, the debounced sidecar writer, the metadata write queue, rebuild from folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false


[dependencies]
dalica-core.workspace = true
dalica-fs.workspace = true
# The metadata write queue sniffs a file's format from its content (a RAW gets an `.xmp` sidecar).
dalica-image.workspace = true
dalica-library.workspace = true
# The metadata write queue reads and merge-writes the owned fields (`metawrite`).
dalica-meta.workspace = true
dalica-sidecar.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Fault points, to show a failed sidecar write leaves the old or the new file.
dalica-fs = { workspace = true, features = ["faults"] }
proptest.workspace = true
# Test photos for the metadata write queue (`tests/metawrite.rs`).
dalica-scenes.workspace = true
tempfile.workspace = true
