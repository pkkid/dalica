# The fuzz targets of `dalica-sidecar` (`docs/security.md` §7.1): a separate cargo-fuzz workspace,
# outside the product graph and excluded from the root workspace, because cargo-fuzz needs nightly
# Rust and sanitizer instrumentation. Run: `cargo +nightly fuzz run <target> corpus/<target>
# seeds/<target>` from this directory (`seeds/` holds a few hand-written starting inputs per target).
[package]
name = "dalica-sidecar-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dalica-sidecar = { path = ".." }
# `recipe`: the edit-operation lists a sidecar holds, read as the editor reads them.
dalica-edit = { path = "../../edit" }
dalica-image = { path = "../../image" }
libfuzzer-sys = "0.4"
serde_json = "1"

# Its own workspace, so the root manifest's members and lockfile are untouched.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "legacy"
path = "fuzz_targets/legacy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recipe"
path = "fuzz_targets/recipe.rs"
test = false
doc = false
bench = false
