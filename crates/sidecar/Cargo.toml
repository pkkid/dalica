[package]
name = "dalica-sidecar"
description = "Dalica L1: The .dalica.json folder sidecar: parse and print with unknown keys preserved; the read-only legacy reader and its conversion to Dalica's model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false


[dependencies]
dalica-core.workspace = true
# Exact float parsing: coordinates (geo, crop, faces) must survive any number of rewrites.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
