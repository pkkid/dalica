[package]
name = "dalica-meta"
description = "Dalica L1: EXIF / IPTC / XMP reading; write-back of owned fields by segment surgery (merge, never replace); MWG face regions; .xmp sidecars for RAW"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test in one binary (tests/all.rs), linked once; see tests/all.rs.
autotests = false

[features]
# The corpus test (`tests/corpus.rs`, docs/development.md §11): the pinned `metadata` corpus, run by
# `cargo xtask test-corpus`. Off by default, so plain `cargo test` and `cargo xtask ci` neither
# compile nor need it.
corpus = []

[[test]]
name = "all"
path = "tests/all.rs"

# The pinned metadata corpus (`cargo xtask test-corpus`): built only with the feature.
[[test]]
name = "corpus"
path = "tests/corpus.rs"
required-features = ["corpus"]

[dependencies]
# Dates without a time zone (`DateTime`), shared with the library model.
dalica-core.workspace = true
# The bounded TIFF/IFD walker (`dalica_image::ifd`): EXIF blocks and TIFF files are read through it.
dalica-image.workspace = true
# zlib for compressed PNG text chunks (`zTXt`, compressed `iTXt`), inflated under a cap. Pure Rust,
# `forbid(unsafe_code)`, MIT OR Apache-2.0; already in the product graph under `png`.
fdeflate.workspace = true
# The IPTC digest (Photoshop resource 0x0425): MD5 of the IIM stream. RFC 1321 in one file with no
# `unsafe`, no dependencies and no build script; MIT OR Apache-2.0 (reviewed for M6.10).
md5.workspace = true
# One line when a caption or keyword is cut to the IPTC limits (already used by dalica-image).
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Reads the committed corpus floors (tests/corpus_floors.json).
serde_json.workspace = true
