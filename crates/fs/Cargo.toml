[package]
name = "dalica-fs"
description = "Dalica L0: Every write to the user's disk: atomic replace + fsync + verify, the read-before-write guard, the library lock, move/copy with verify, the OS trash, bounded walks, the UI-thread guard and fault-injection points (feature faults)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false

[features]
# Named fault points (`faults` module) that tests arm to fail or "crash" each step of a write.
faults = []

[dependencies]
dalica-core.workspace = true
thiserror.workspace = true
# The OS trash (`trash` module, security.md §5.7): the freedesktop.org trash on Linux and the BSDs,
# the Recycle Bin through the shell on Windows, `NSFileManager` on macOS. Pure Rust (MIT).
trash.workspace = true

[target.'cfg(unix)'.dependencies]
# Every step of an atomic replace relative to one held folder handle (security.md §5.6).
# `process` for the user id that names a volume's own trash folder (`.Trash-<uid>`).
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# The file identity (volume serial number and file index) through a handle (security.md §5.2).
winapi-util.workspace = true

[dev-dependencies]
# Tests always build with the fault points, so `cargo test` (and `cargo xtask ci`) runs the fault loops.
dalica-fs = { path = ".", features = ["faults"] }
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
