[package]
name = "dalica-fs"
description = "Dalica L0: Every write to the user's disk: atomic replace + fsync + verify, the read-before-write guard, the library lock, move/copy with verify, the OS trash, bounded walks, the UI-thread guard and fault-injection points (feature faults)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Named fault points (`faults` module) that tests arm to fail or "crash" each step of a write.
faults = []

[dependencies]
dalica-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests always build with the fault points, so `cargo test` (and `cargo xtask ci`) runs the fault loops.
dalica-fs = { path = ".", features = ["faults"] }
tempfile.workspace = true
