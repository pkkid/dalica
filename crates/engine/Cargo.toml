[package]
name = "dalica-engine"
description = "Dalica L4: Session: library + store + jobs + settings + undo stacks; the command registry (cmd/<area>.rs); keyboard contexts and the keymap; control-protocol types; demo library setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# HEIF/HEIC decoding (formats.md §3), off by default; with it `tests/save_formats.rs` runs its HEIC
# case: `cargo test -p dalica-engine --features heif --test save_formats`.
heif = ["dalica-image/heif"]

[dependencies]
dalica-core.workspace = true
# Export and Save through the one output pipeline (`cmd/export.rs`, M8.16; `cmd/save.rs`, M8.15).
dalica-create.workspace = true
# Edit recipes: rotations and flips appended with their merge and cancel rules (`cmd/rotate.rs`).
dalica-edit.workspace = true
dalica-fs.workspace = true
# Decode limits of the thumbnail jobs (`thumbs.rs`).
dalica-image.workspace = true
dalica-library.workspace = true
# What a photo's file says about itself, for `photo.metadata` (`metadata_cache.rs`).
dalica-meta.workspace = true
dalica-scan.workspace = true
# The demo library's photos (`demo.rs`).
dalica-scenes.workspace = true
# The originals record's entries a Save answers (`cmd/save.rs`).
dalica-sidecar.workspace = true
dalica-store.workspace = true
# Sketches of synthetic libraries (`synthetic.rs`) and the thumbnail ladder (`thumbs.rs`).
dalica-thumbs.workspace = true
log.workspace = true
# The preview halves its sources in parallel bands (`preview/jobs.rs`).
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Fault points, to plant a Save stopped at an exact step before a session reopens (M8.18).
dalica-fs = { workspace = true, features = ["faults"] }
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "first_thumbnails"
harness = false

[[bench]]
name = "edit_preview"
harness = false

[[bench]]
name = "save_export"
harness = false

[[bench]]
name = "search"
harness = false
