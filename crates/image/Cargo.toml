[package]
name = "dalica-image"
description = "Dalica L1: Sniffing, scaled decoding, encoding, orientation, ICC → sRGB, decode limits, embedded thumbnails and RAW previews (a bounded TIFF/IFD walker of our own)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false


[dependencies]
dalica-core.workspace = true
# GIF (first frame) and BMP through its decoders (`formats.md` §1); already in the product graph via `thumbs`.
image.workspace = true
# Lossy and lossless WebP, alpha, the first frame of animations (`formats.md` §1).
image-webp.workspace = true
# JPEG XL (architecture.md §1): pure Rust, MIT OR Apache-2.0; single-threaded (no `rayon`).
jxl-oxide.workspace = true
log.workspace = true
# ICC v2/v4 profiles to sRGB (architecture.md §1): pure Rust, BSD-3-Clause OR Apache-2.0.
moxcms.workspace = true
png.workspace = true
thiserror.workspace = true
# TIFF strips and tiles (LZW, Deflate, PackBits, JPEG, predictors): pure Rust, MIT. Our own reader
# walks the IFDs and checks the limits first (formats/tiff.rs).
tiff.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
dalica-scenes.workspace = true
# Its JPEG encoder writes test JPEGs from arbitrary pixels, with APP2 profiles (tests/color.rs).
image = { workspace = true, features = ["jpeg"] }
# Encodes test-only PNG layouts (16-bit, grey) and the PNGs written on a fingerprint mismatch.
png.workspace = true
proptest.workspace = true
# Lossless JPEG XL codestreams of oriented and re-tagged pixels (tests/jxl.rs).
zune-jpegxl.workspace = true
zune-core.workspace = true
