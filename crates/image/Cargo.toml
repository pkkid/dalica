[package]
name = "dalica-image"
description = "Dalica L1: Sniffing, scaled decoding, encoding, orientation, ICC → sRGB, decode limits, embedded thumbnails and RAW previews (a bounded TIFF/IFD walker of our own)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test in one binary (tests/all.rs), linked once; see tests/all.rs.
autotests = false

[features]
# HEIF/HEIC decoding through heic-rs (formats.md §3). Off by default: shipping an HEVC decoder is the
# distributor's decision; without it HEIC files show "HEIC support isn't included in this build".
heif = ["dep:heic-rs"]
# HEVC video frames through rusty_h265 (formats.md §1, docs/video-decoders.md). Off by default, as
# `heif`: decoding HEVC needs a patent licence in some countries, and whether release builds carry it
# is the maintainer's question at M15.R. Without it an HEVC clip answers "This video can't be played
# (HEVC support isn't included in this build)".
hevc = ["dep:rusty_h265"]
# The corpus tests (`tests/corpus.rs`, docs/development.md §11): real files from the pinned corpora,
# run by `cargo xtask test-corpus`. Off by default, so plain `cargo test` and `cargo xtask ci`
# neither compile nor need them.
corpus = []

[[test]]
name = "all"
path = "tests/all.rs"

# HEIF on its own: half of it needs the `heif` feature (`--features heif --test heif`).
[[test]]
name = "heif"
path = "tests/heif.rs"

# The pinned corpora (`cargo xtask test-corpus`): built only with the feature.
[[test]]
name = "corpus"
path = "tests/corpus.rs"
required-features = ["corpus"]

[dependencies]
dalica-core.workspace = true
# Pure Rust, no unsafe, MIT OR Apache-2.0; only with the `heif` feature (security.md §8.6 review in
# the M5.10 commit).
heic-rs = { workspace = true, optional = true }
# H.264 video frames (formats/video/frames/h264.rs; docs/video-decoders.md §2): pure Rust, MIT, no
# dependencies; run on the calling thread unless a caller asks for threads. Its `unsafe` is M15.R's
# question (the record's §8.2).
altc264.workspace = true
# HEVC video frames, only with the `hevc` feature (formats/video/frames/hevc.rs).
rusty_h265 = { workspace = true, optional = true }
# The clip's AAC sound (formats/video/sound.rs): pure Rust, Apache-2.0, no dependencies, no defaults.
rusty_aac.workspace = true
# Slideshow music (formats/audio.rs, M15.27; docs/video-decoders.md §7.3): MP3, Ogg Vorbis, FLAC, WAV.
nanomp3.workspace = true
lewton.workspace = true
claxon.workspace = true
hound.workspace = true
# GIF (first frame) and BMP through its decoders (`formats.md` §1); already in the product graph via `thumbs`.
image.workspace = true
# Lossy and lossless WebP, alpha, the first frame of animations (`formats.md` §1).
image-webp.workspace = true
# JPEG XL (architecture.md §1): pure Rust, MIT OR Apache-2.0; single-threaded (no `rayon`).
jxl-oxide.workspace = true
# The image header and an embedded ICC profile's declared sizes, read before `jxl-oxide` reserves
# the profile outside its allocation tracker (formats/jxl.rs). Same project and licence, already
# compiled as `jxl-oxide`'s own dependencies.
jxl-bitstream.workspace = true
jxl-coding.workspace = true
jxl-oxide-common.workspace = true
log.workspace = true
# ICC v2/v4 profiles to sRGB (architecture.md §1): pure Rust, BSD-3-Clause OR Apache-2.0.
moxcms.workspace = true
png.workspace = true
thiserror.workspace = true
# TIFF strips and tiles (LZW, Deflate, PackBits, JPEG, predictors): pure Rust, MIT. Our own reader
# walks the IFDs and checks the limits first (formats/tiff.rs).
tiff.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
dalica-scenes.workspace = true
# Its JPEG encoder writes test JPEGs from arbitrary pixels, with APP2 profiles (tests/color.rs).
image = { workspace = true, features = ["jpeg"] }
# Encodes test-only PNG layouts (16-bit, grey) and the PNGs written on a fingerprint mismatch.
png.workspace = true
proptest.workspace = true
# Reads the committed corpus floors (tests/corpus_floors.json).
serde_json.workspace = true
# Lossless JPEG XL codestreams of oriented and re-tagged pixels (tests/jxl.rs).
zune-jpegxl.workspace = true
zune-core.workspace = true
# The refusal of a declared size past the limits allocates nothing (tests/jxl.rs); it installs
# its counting allocator in the test binaries that use it.
allocation-counter.workspace = true
# Ogg Vorbis music made by tests/audio.rs.
rusty_vorbis.workspace = true

[[bench]]
name = "video_probe"
harness = false
path = "benches/video.rs"
