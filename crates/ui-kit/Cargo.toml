[package]
name = "dalica-ui-kit"
description = "Dalica L5: The generic look: Tokens, widgets, icons drawn in code, the widget registry and the CPU rasterizer for screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary (tests/all.rs) instead of one per file: one link, the tests run in parallel.
autotests = false

[dependencies]
dalica-core.workspace = true
egui.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
ab_glyph.workspace = true
dalica-scenes.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
