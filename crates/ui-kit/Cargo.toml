[package]
name = "dalica-ui-kit"
description = "Dalica L5: The generic look: Tokens, widgets, icons drawn in code, the widget registry and the CPU rasterizer for screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary (tests/all.rs) instead of one per file: one link, the tests run in parallel.
autotests = false

[dependencies]
dalica-core.workspace = true
egui.workspace = true
icu_segmenter.workspace = true
serde.workspace = true
thiserror.workspace = true

# The CJK faces subset at build time (`build.rs`, M16.27).
[build-dependencies]
ttf-parser.workspace = true

[dev-dependencies]
ab_glyph.workspace = true
dalica-scenes.workspace = true
# `tests/fonts.rs` includes `build.rs`, and checks its table of the four CJK character sets
# against encoding_rs's decoders.
encoding_rs.workspace = true
ttf-parser.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
