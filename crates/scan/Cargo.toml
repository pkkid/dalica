[package]
name = "dalica-scan"
description = "Dalica L3: Watched-folder rules, walks, change detection, notify events, offline volumes and card/folder import; turns what it finds into Ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false


[dependencies]
dalica-core.workspace = true
dalica-fs.workspace = true
dalica-image.workspace = true
dalica-library.workspace = true
# Legacy recipes mapped to Dalica's operations: the originals folder's (M14.14) and the sidecar's (`legacy.rs`, M14.11; `data-model.md` §9).
dalica-edit.workspace = true
dalica-meta.workspace = true
# Each import candidate's digest (`import.rs`), as `dalica-engine`'s duplicates and Save's records make them.
md5.workspace = true
dalica-sidecar.workspace = true
notify.workspace = true

# Cameras and phones over PTP/MTP (`src/ptp/usb.rs`, M15.9); see the root manifest. Optional
# only so the fuzz workspace can leave it out (`nusb` does not build under `--cfg fuzzing`).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nusb = { workspace = true, optional = true }

[features]
default = ["usb"]
# The USB transport (Linux and Windows).
usb = ["dep:nusb"]

[dev-dependencies]
dalica-scenes.workspace = true
tempfile.workspace = true
# The legacy_scan bench's `--json` report (M14.22); already in the product graph.
serde_json.workspace = true
# Random containers against the PTP reader (`tests/ptp.rs`).
proptest.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "legacy_scan"
harness = false
path = "benches/legacy.rs"
