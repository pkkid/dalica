[package]
name = "dalica-core"
description = "Dalica L0: Ids (PhotoId, FolderId, AlbumId, PersonId), errors, normalised geometry, dates, path and name utilities (collision names -001), position keys and the Clock trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
