[package]
name = "dalica-scenes"
description = "Dalica L1: Procedural test and demo photos (gradients, horizons, soft blobs, text-free patterns) at any size, depth and orientation, with a minimal EXIF block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test in one binary (tests/all.rs), linked once; see tests/all.rs.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
dalica-core.workspace = true
# Its JPEG encoder (MIT OR Apache-2.0); `jpeg-encoder` carries the IJG licence, which the deps gate refuses.
# Its WebP (lossless), GIF and BMP encoders write the test files of those formats.
# Tests also use `image` as the independent decoder.
image = { workspace = true, features = ["jpeg"] }
png.workspace = true
# zlib for Deflate TIFF strips.
fdeflate.workspace = true
# Lossless JPEG XL test files.
zune-jpegxl.workspace = true
zune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Profiles must parse with the colour engine the product uses.
moxcms.workspace = true
# `image`'s TIFF backend, used directly for layouts `image` refuses (palette, grey float, IFD1).
tiff.workspace = true
# The product's JPEG XL decoder reads the JPEG XL files back.
jxl-oxide.workspace = true
