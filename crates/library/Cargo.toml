[package]
name = "dalica-library"
description = "Dalica L2: The in-memory model (folders, photos, albums, people, tags, captions, stars, hidden, recipes, places), Ops with inverses, revisions, queries and the search grammar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every integration test is a module of one binary (`tests/all.rs`): one link, not one per file.
autotests = false


[dependencies]
dalica-core.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# The journal (`dalica-store`) parses floats exactly (`float_roundtrip`, through `dalica-sidecar`):
# the op tests do too, so an op with a typed geotag survives the JSON bit for bit (M16.41).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[test]]
name = "all"
path = "tests/all.rs"
