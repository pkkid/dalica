      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/ui/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      # Without `--cfg fuzzing`: the UI links `dalica-scan`'s USB transport, and `nusb` does not
      # build under it; no Dalica crate reads that cfg.
      - name: Build every target
        working-directory: crates/ui/fuzz
        run: cargo +nightly fuzz build --no-cfg-fuzzing
      - name: Run every target
        working-directory: crates/ui/fuzz
