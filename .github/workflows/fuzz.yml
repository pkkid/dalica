# Fuzzing `dalica-image`, `dalica-meta`, `dalica-faces`, `dalica-fetch`, `dalica-sidecar`,
# `dalica-scan`, `dalica-store` and `dalica-ui` (docs/security.md §7): every target of
# `crates/image/fuzz`, `crates/meta/fuzz`, `crates/faces/fuzz`, `crates/fetch/fuzz`,
# `crates/sidecar/fuzz`, `crates/scan/fuzz`, `crates/store/fuzz` and `crates/ui/fuzz` (separate
# cargo-fuzz workspaces on nightly Rust). Like every test run on GitHub, it runs only at
# a milestone review (the pull request of a `review/M<n>.R` branch: every target built and run for
# 60 s) and when dispatched by hand (`seconds` per target); a task's pull request runs nothing
# (docs/development.md §3).
# `dalica-meta` reads through `dalica-image`'s IFD walker, so those jobs always run together;
# `dalica-faces` (the face models' reader and interpreter), `dalica-fetch` (a server's reply as
# the HTTPS transport reads it), `dalica-sidecar` (the folder sidecar, the originals record,
# `albums.json`, the edit lists and the legacy sidecar reader), `dalica-scan` (what a camera sends
# to the PTP/MTP reader), `dalica-store` (the index journal and snapshot, `people.json`) and
# `dalica-ui` (a control-channel request line, handled by the headless app) have their own jobs.
# The sidecar, store and ui jobs start each target from its `seeds/<target>` beside the corpus.
# Actions are pinned to full commit hashes (docs/security.md §8.5).
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        required: true
        default: "120"
  pull_request:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  image:
    name: fuzz dalica-image
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/image/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Build every target
        working-directory: crates/image/fuzz
        run: cargo +nightly fuzz build
      - name: Run every target
        working-directory: crates/image/fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/image/fuzz/artifacts
          if-no-files-found: ignore

  meta:
    name: fuzz dalica-meta
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
