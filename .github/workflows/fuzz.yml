      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/store/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Build every target
        working-directory: crates/store/fuzz
        run: cargo +nightly fuzz build
      - name: Run every target
        working-directory: crates/store/fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: |
