  fetch:
    name: fuzz dalica-fetch
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/fetch/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Build every target
        working-directory: crates/fetch/fuzz
        run: cargo +nightly fuzz build
      - name: Run every target
        working-directory: crates/fetch/fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-fetch
          path: crates/fetch/fuzz/artifacts
          if-no-files-found: ignore

  sidecar:
    name: fuzz dalica-sidecar
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/sidecar/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Build every target
        working-directory: crates/sidecar/fuzz
        run: cargo +nightly fuzz build
      - name: Run every target
        working-directory: crates/sidecar/fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
