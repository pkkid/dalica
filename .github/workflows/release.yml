# The release pipeline (docs/releasing.md, docs/security.md §10). A push to `release` builds every
# platform, checksums and verifies the artifact set, and creates or updates the draft GitHub
# Release "Dalica v<version>" tagged on the pushed commit. A maintainer publishes the draft.
#
# Every other run is a dry run that still builds, checksums and verifies: a manual run on any other
# branch, and a pull request that touches packaging/, the workflows or the icons. In a dry run the
# signing jobs run without the `release` environment and without its secrets, each signing with a
# throwaway self-signed identity it makes itself (trusted on that runner only), so the signing path
# runs on every packaging pull request; macOS notarization and stapling, which need Apple's
# credentials, are skipped there and named; the draft job never runs.
#
# Least privilege: the workflow reads (`contents: read`); the build jobs read no secrets and run
# without the `release` environment; only the signing jobs of a release run use that environment
# and its secrets, each secret optional (a missing one is a ::warning:: and an unsigned artifact);
# only the draft job gets `contents: write`. Inputs reach scripts through `env`, never through `${{ }}` inside a
# script. Actions are pinned to full commit hashes (docs/security.md §8.5).
#
# Adapted from LightCraft .github/workflows/release.yml @ 25ef65c8 (MIT OR Apache-2.0): the version
# job, the per-OS jobs and the create-or-update draft step. Changed for Dalica: build and signing
# are separate jobs (so a dry run builds macOS and Windows too), dry runs on pull requests, a
# checksum job and a verify job on three OSes, an early refusal of a published version, and the
# pinned toolchain of ci.yml.
name: Release

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/**"
      - "assets/app-icon/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this run only, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a release run mid-upload; a newer push waits its turn. A pull request's dry run
  # is replaced by the next push to it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The craft-fonts pin (docs/releasing.md → What gets built). Bump it deliberately.
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3
  DALICA_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      real: ${{ steps.v.outputs.real }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve the version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          fi
          # The same rule as `cargo xtask version set` (xtask/src/version.rs): X.Y.Z[-pre]. The
          # character check comes first, because grep would accept one good line among several.
          case "$v" in
            "" | *[!0-9A-Za-z.-]*) ok=false ;;
            *) if printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'; then ok=true; else ok=false; fi ;;
          esac
          if [ "$ok" = false ]; then
            echo "::error::'${v//[^0-9A-Za-z.-]/?}' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          if [ "$REF" = refs/heads/release ] && [ "$EVENT" != pull_request ]; then real=true; else real=false; fi
          # Refuse early a version whose release is already published (the draft job checks again).
          if draft="$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$draft" = false ]; then
            if [ "$real" = true ]; then
              echo "::error::Dalica v$v is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "::warning::Dalica v$v is already published; a push to release with this version would be refused."
          fi
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
            echo "real=$real"
          } >>"$GITHUB_OUTPUT"
          if [ "$real" = true ]; then kind="release run"; else kind="dry run (signed with throwaway identities; nothing notarized or drafted)"; fi
          echo "### Dalica v$v at \`${GITHUB_SHA::9}\`: $kind" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: build Linux ${{ matrix.arch }}
    needs: version
    # The oldest supported Ubuntu LTS image, for a low glibc floor (docs/releasing.md).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      DALICA_VERSION: ${{ needs.version.outputs.version }}
      DALICA_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Linux packages for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Apply the version input
        if: inputs.version != ''
        run: |
          cargo fetch --locked
          cargo xtask version set "$DALICA_VERSION"
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: build Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
    env:
      DALICA_VERSION: ${{ needs.version.outputs.version }}
      DALICA_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply the version input
        if: inputs.version != ''
        shell: bash
        run: |
          cargo fetch --locked
          cargo xtask version set "$DALICA_VERSION"
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/package.ps1 -Arch $env:ARCH -NoSign
      # Unsigned here; the signing job replaces it with the set it builds from the stage below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      # The tested programs and licence files, for the signing job to sign and package (not a
      # release asset: the checksum and draft jobs take `release-*` only).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-windows-${{ matrix.arch }}
          path: |
            target/windows-package/${{ matrix.arch }}/bin/
            target/windows-package/${{ matrix.arch }}/doc/
          if-no-files-found: error
          retention-days: 3

  macos:
    name: build macOS universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DALICA_VERSION: ${{ needs.version.outputs.version }}
      DALICA_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - name: Apply the version input
        if: inputs.version != ''
        run: |
          cargo fetch --locked
          cargo xtask version set "$DALICA_VERSION"
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh
      # Signed ad hoc here; the signing job replaces it with the set it signs from the stage below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      # The tested universal programs and licence files, for the signing job to sign and package
      # (not a release asset: the checksum and draft jobs take `release-*` only).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-macos-universal
          path: |
            target/macos-package/bin/
            target/macos-package/doc/
          if-no-files-found: error
          retention-days: 3

  # The signing jobs: in a release run the only jobs in the `release` environment and the only
  # ones that see its secrets. One job per Windows architecture the build matrix makes (x64 only
  # until ARM64 lands).
  #
  # Windows (M15.10): sign.ps1 signs dalica.exe and dalica-cli.exe from the build job's stage, the
  # MSI is built around the signed programs and signed, the portable zip is made again, and
  # test-sign.ps1 checks every signature (package.ps1 -FromStage). A release run signs with the
  # `.pfx` (WINDOWS_CERTIFICATE) or Azure Trusted Signing (the AZURE_* secrets), whichever is set,
  # and without either leaves the set unsigned with a ::warning:: naming each file. A dry run never
  # reads those secrets: it signs with a throwaway self-signed certificate made in the job
  # (sign.ps1 -Throwaway), and its output is never drafted. The checksum job runs after this one,
  # so SHA256SUMS.txt is written over the signed set.
  sign-windows:
    name: sign Windows x64
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    # A release run only; an empty name runs the dry run without an environment.
    environment: ${{ needs.version.outputs.real == 'true' && 'release' || '' }}
    env:
      DALICA_VERSION: ${{ needs.version.outputs.version }}
      DALICA_BUILD_DATE: ${{ needs.version.outputs.date }}
      REAL: ${{ needs.version.outputs.real }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage-windows-x64
          path: stage
      - name: Sign and package
        shell: pwsh
        # The secrets reach the scripts only through these variables, and only in a release run.
        env:
          WINDOWS_CERTIFICATE: ${{ needs.version.outputs.real == 'true' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ needs.version.outputs.real == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE: ${{ needs.version.outputs.real == 'true' && secrets.AZURE_CERT_PROFILE || '' }}
        run: |
          if ($env:REAL -ne 'true') {
            Write-Output 'Dry run: signing with a throwaway self-signed certificate (never trusted elsewhere, never drafted)'
            ./packaging/windows/sign.ps1 -Throwaway
          }
          Remove-Item -Recurse -Force dist/release -ErrorAction SilentlyContinue
          ./packaging/windows/package.ps1 -Arch x64 -FromStage stage -NoTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # macOS (M15.13): package.sh --from-stage assembles Dalica.app from the build job's universal
  # programs, signs it inside-out with the hardened runtime and a secure timestamp, builds and signs
  # the DMG and the CLI zip, notarizes the app, the DMG and the zip (notarize.sh) and staples the
  # app and the DMG, then verify.sh checks the set as users download it. A release run imports the
  # Developer ID certificate (APPLE_CERTIFICATE) into a temporary keychain and notarizes with the
  # three Apple secrets (all or none); without the certificate it warns and signs ad hoc, without
  # the three it warns and does not notarize. A dry run never reads those secrets: it signs with a
  # throwaway self-signed identity made in a temporary keychain (import-cert.sh --throwaway), and
  # notarization, stapling and Gatekeeper's checks are skipped and named. The keychain is deleted
  # at the job's end whatever happened.
  sign-macos:
    name: sign macOS universal
    needs: [version, macos]
    runs-on: macos-latest
    timeout-minutes: 90
    # A release run only; an empty name runs the dry run without an environment.
    environment: ${{ needs.version.outputs.real == 'true' && 'release' || '' }}
    env:
      DALICA_VERSION: ${{ needs.version.outputs.version }}
      DALICA_BUILD_DATE: ${{ needs.version.outputs.date }}
      REAL: ${{ needs.version.outputs.real }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage-macos-universal
          path: stage
      - name: Signing identity
        # The secrets reach the script only through these variables, and only in a release run.
        env:
          APPLE_CERTIFICATE: ${{ needs.version.outputs.real == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.version.outputs.real == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ needs.version.outputs.real == 'true' && secrets.KEYCHAIN_PASSWORD || '' }}
        run: |
          if [ "$REAL" = true ]; then
            packaging/macos/import-cert.sh
          else
            echo "Dry run: signing with a throwaway self-signed identity (never trusted elsewhere, never notarized or drafted)"
            packaging/macos/import-cert.sh --throwaway
          fi
      - name: Sign, notarize and package
        env:
          APPLE_ID: ${{ needs.version.outputs.real == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.version.outputs.real == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.version.outputs.real == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          rm -rf dist/release
          packaging/macos/package.sh --from-stage stage
      - name: Delete the temporary keychain
        if: always()
        timeout-minutes: 5
        run: packaging/macos/import-cert.sh --delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # SHA256SUMS.txt over the complete artifact set, written after signing: the signed set on the
  # release branch; in a dry run the Windows and macOS sets signed with the throwaway identities and
  # the Linux build outputs as built.
  checksums:
    name: checksums
    needs: [version, linux, windows, macos, sign-windows, sign-macos]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        run: |
          packaging/checksums.sh create dist/release
          cat dist/release/SHA256SUMS.txt
          ls -l dist/release
          {
            echo "#### SHA256SUMS.txt"
            echo
            sed 's/^/    /' dist/release/SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # The checksum step: a fresh runner per OS re-downloads the artifacts and SHA256SUMS.txt and
  # verifies them, as a user would; the script's own planted-mismatch test runs first.
  verify:
    name: verify checksums (${{ matrix.os }})
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: verify
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: verify
      - name: The checksum script's planted-mismatch test
        shell: bash
        run: bash packaging/checksums.sh self-test
      - name: Verify the artifacts against SHA256SUMS.txt
        shell: bash
        run: bash packaging/checksums.sh verify verify

  release:
    name: draft GitHub Release
    needs: [version, checksums, verify, sign-windows, sign-macos]
    # Only a release-branch run reaches here.
    if: needs.version.outputs.real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: artifacts
      - name: Verify the set once more
        run: bash packaging/checksums.sh verify artifacts
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="Dalica v$VERSION"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::$title is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "Updating the draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating the draft $tag"
            pre=()
            if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\` (each platform's signature state is in its signing job's summary):"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
