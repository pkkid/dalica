# The gate on every pull request and every push to main: `cargo xtask ci` on Linux, Windows and macOS
# (docs/development.md §3). Actions are pinned to full commit hashes (docs/security.md §8.5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # LF everywhere, so parsers and fingerprints see the same bytes on every OS.
      - run: git config --global core.autocrlf false
      # Windows Defender scans every file the build and the tests create and every process they
      # start, which more than doubled the test time (M4.R). The runner is thrown away after the
      # job, so its real-time scanning skips the workspace, the toolchain, the temp folders and the
      # build tools. No test changes; every check still runs.
      - name: Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "link.exe", "rustdoc.exe"
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: cargo xtask ci
        run: cargo xtask ci
      # The optional HEIF decoder (docs/formats.md §3) is off by default, so `xtask ci` never
      # builds it: lint and test dalica-image with it on every OS. The integration tests and the
      # HEIF module's own unit tests run; the rest of the crate's unit tests already ran above.
      - name: dalica-image with the heif feature (clippy)
        shell: bash
        run: cargo clippy -p dalica-image --all-targets --features heif -- -D warnings
      - name: dalica-image with the heif feature (tests)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dalica-image --features heif --test '*'
          cargo test -p dalica-image --features heif --lib formats::heif
