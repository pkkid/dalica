# The review gate on GitHub (docs/development.md §3): `cargo xtask ci --full` once per milestone, on
# the pull request of its `review/M<n>.R` branch, and whenever dispatched by hand (Actions tab, any
# branch). A task's pull request and a push to main run nothing here: the worker's local task gate
# tests what the task changed and the lead's merge gate checks that everything still builds.
# Linux runs the whole review gate; Windows and macOS run its platform part (`--full --platform`),
# which leaves out what gives the same answer on every system (format and static checks, the heif
# tests, the pure crates), so no test runs twice. Each system's gate runs as two jobs side by side,
# its tests (`--tests-only`) and its acceptance steps (`--accept-only`), so each half finishes within
# the job's time limit (the whole took 65 minutes on Windows at M13.R). Actions are pinned to full
# commit hashes (docs/security.md §8.5).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The craft-fonts pin, the same as release.yml's (docs/releasing.md): the ci jobs build with the
  # fallback faces, so the ui-kit glyph tests run with them. Bump both together.
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3

jobs:
  ci:
    name: ci (${{ matrix.os }}, ${{ matrix.part }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        part: [tests, accept]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # LF everywhere, so parsers and fingerprints see the same bytes on every OS.
      - run: git config --global core.autocrlf false
      # Windows Defender scans every file the build and the tests create and every process they
      # start, which more than doubled the test time (M4.R). The runner is thrown away after the
      # job, so its real-time scanning skips the workspace, the toolchain, the temp folders and the
      # build tools. No test changes; every check still runs.
      - name: Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "link.exe", "rustdoc.exe"
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # craft-fonts at its pin, in the runner's temp folder: outside the repository's checkout, so
      # no gate (names, assets, the changed-files check) sees its files as ours.
      - name: craft-fonts at its pin
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" fetch -q --depth 1 https://github.com/storytold/craft-fonts "$CRAFT_FONTS_REF"
          git -C "$RUNNER_TEMP/craft-fonts" checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # One cache per half: the two build different things (every test; the app and the acceptance
      # tests).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.part }}
      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: cargo xtask ci --full --${{ matrix.part }}-only
        if: runner.os == 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ runner.temp }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo xtask ci --full --${{ matrix.part }}-only
      - name: cargo xtask ci --full --platform --${{ matrix.part }}-only
        if: runner.os != 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ runner.temp }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo xtask ci --full --platform --${{ matrix.part }}-only
      # A failed run keeps its renders (the screenshots and fingerprint renders under
      # target/test-output), so a fingerprint that moves on one OS can be looked at, not guessed.
      - name: renders of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.part }}
          path: target/test-output
          retention-days: 7
          if-no-files-found: ignore

  # The test corpora (docs/development.md §11): every published set fetched from its pin and
  # sha256-verified, then the corpus tests with their committed floors. `corpus/` is cached under a
  # key of the pins and the manifests; `cargo xtask corpus --all` re-hashes a restored cache and
  # fetches only what is missing or stale (the face models, 300 MB, come from their own
  # repositories). The only CI job that uses the network for test data.
  corpus:
    name: corpus
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/corpus/*.sha256') }}
      - name: cargo xtask corpus --all
        run: cargo xtask corpus --all
      - name: dalica-image corpus tests (clippy)
        run: cargo clippy -p dalica-image --all-targets --features corpus,heif -- -D warnings
      - name: dalica-meta corpus tests (clippy)
        run: cargo clippy -p dalica-meta --all-targets --features corpus -- -D warnings
      - name: dalica-faces corpus tests (clippy)
        run: cargo clippy -p dalica-faces --all-targets --features corpus -- -D warnings
      - name: cargo xtask test-corpus
        env:
          DALICA_FULL_TESTS: "1"
        run: cargo xtask test-corpus
