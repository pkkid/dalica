# The release frame budgets, Linux only: `cargo xtask budgets` builds in
# release and runs the budgets the milestones' acceptance tests assert only with
# `DALICA_ACCEPT_RELEASE=1` (M4: the 100 k scroll and the thumb at top speed, UI frame time
# p95 ≤ 8 ms, cells visited flat), failing the run when one is missed (docs/development.md §8).
# Since M7 a second step runs the edit view's preview bench, which judges its own budgets (open a
# 24 MP JPEG ≤ 150 ms, a slider drag ≤ 16 ms draft and ≤ 100 ms final, next/previous ≤ 50 ms).
# Since M8 `cargo xtask budgets` also runs the save_export bench: Save of a 24 MP JPEG, rendered
# and rotate-only, and the 200-photo mixed export, each median within 1.5 × its first measurement.
# Since M9 also the search bench over a synthetic 100 k library: the index built, three queries and
# search.set to its result applied, each median within 1.5 × its first measurement (a query never
# above 100 ms).
# Since M10 also the P0 budgets left: scan_throughput (a first scan of 5 000 JPEGs with embedded
# thumbnails, >= 500 photos/s until each is listed with its embedded thumbnail available) and
# cold_start (a fresh process opening the 100 k index-only library to its first settled frame,
# median <= 2 s; resident memory after 5 s idle <= 600 MiB). Both absolute, never loosened.
# Since M11 also import (1 000 JPEGs from a temporary card: the first screenful of thumbnails, the
# listing, files and MB per second copied and verified), batch_edit (Auto Fix on 1 000 photos as
# one step, then its undo) and slideshow (24 MP photos in the headless app: no change waits for its
# preview, the advance, a transition frame within 16 ms at p95), each 1.5 x its first measurement.
# Since M12 also effects (each of the 27 effects at its defaults rendered at 24 MP as Save renders
# it, and an empty recipe; since M13.43 also a slider's drafts and finals, each draft at the scale
# its budget was measured at since M13.R, the engine's own draft within 16 ms) and effect_tiles (an effect tab's tiles of a 24 MP photo from opening it to the last
# tile), and the slideshow's upload frame (p95), each 1.5 x its first measurement (about 6 minutes).
# Since M13 also inference (face detection at 640 px and one embedding per candidate recogniser, on
# seeded networks of the candidate models' shapes), faces_scan (the background face scan over 1 000
# photos: faces per second, memory per worker, the owner's frame time while it runs, never above
# 16 ms at p95) and people_places (the Unnamed grid with 10 000 faces and the Places pane with
# 10 000 geotagged photos), each 1.5 x its first measurement on a workstation; on this runner
# inference and people_places are judged against the commit that first measured them (M13.R).
# Since M14 also collage (each style's layout of 200 pictures; a pile of 50 photos rendered at
# 3000 px, its time and peak memory), legacy_scan (a first scan of 10 000 photos in 100 folders with
# only the previous organizer's sidecar against the same with .dalica.json, and a 64 MiB legacy
# sidecar) and collage_canvas (the Collage room's frame with 100 pictures while one is dragged,
# never above 16 ms at p95), each 1.5 x its first measurement on a workstation.
# Like every test run on GitHub, it runs only at a milestone review (the pull request of a
# `review/M<n>.R` branch) and when dispatched by hand: "Run workflow" on the Actions tab, which also
# takes a planted slowdown to prove that a missed budget fails the run (docs/development.md §3, §8).
# Its own file, so it never shares ci.yml's matrix; cached like ci.yml. Actions are pinned to full
# commit hashes (docs/security.md §8.5).
name: Budgets

on:
  pull_request:
  workflow_dispatch:
    inputs:
      plant_ms:
        description: "A planted slowdown, in ms per frame (0: none; 8 must fail the run)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: budgets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  budgets:
    name: release budgets (ubuntu-latest)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history and the release tags: the save, search and import (first screenful,
          # listing) budgets are judged against the last release measured on this same runner.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.98"
      # The job id names the cache, so this release cache never mixes with ci.yml's debug one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux packages for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: cargo xtask budgets
        env:
          PLANT_MS: ${{ inputs.plant_ms || '0' }}
        # The save/export and search budgets, the import's first screenful and listing (M12.R), and
        # face inference and the people and places views (M13.R) are judged against the last
        # release (or, for a bench newer than it, the commit that first measured it) run on this
        # runner in the same job, three times each, interleaved: at most 1.3 x its medians (the
        # people and places frames: their p95) (maintainer decisions, 2026-10-15, M12.R, M13.R).
        # Runner hardware varies more than the absolute budgets allowed; the frame budgets (8 ms)
        # and caps stay absolute.
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
          echo "baseline: $base"
          cargo xtask budgets --plant-ms "$PLANT_MS" --baseline "$base"
      # Runs after the step above even when it failed, so the log shows every budget.
      - name: edit_preview budgets (M7)
        if: ${{ !cancelled() }}
        env:
          PLANT_MS: ${{ inputs.plant_ms || '0' }}
        run: cargo bench -p dalica-engine --bench edit_preview -- --check --plant-ms "$PLANT_MS" --json
