# The fuzz target of the app's control-channel transport (`docs/security.md` §6.5, §7.1): the
# `auth` step every connection takes before anything reaches the UI. A separate cargo-fuzz
# workspace, outside the product graph and excluded from the root workspace, because cargo-fuzz
# needs nightly Rust and sanitizer instrumentation. The transport and token modules are compiled
# in from `../src/control` (`#[path]`), so the app's window, GPU and camera dependencies stay out.
# Run: `cargo +nightly fuzz run auth corpus/auth seeds/auth` from this directory (`seeds/` holds a
# few starting connections).
[package]
name = "dalica-app-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dalica-core = { path = "../../../crates/core" }
dalica-fs = { path = "../../../crates/fs" }
# Without the camera USB transport: `nusb` does not build under `--cfg fuzzing` (M15.52).
dalica-ui = { path = "../../../crates/ui", default-features = false }
getrandom = "0.4"
libfuzzer-sys = "0.4"
log = "0.4"
serde_json = "1"

# Its own workspace, so the root manifest's members and lockfile are untouched.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "auth"
path = "fuzz_targets/auth.rs"
test = false
doc = false
bench = false
