[package]
name = "dalica"
description = "Dalica desktop app: the eframe window, the control-server transport, the native menu and the rfd picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One test binary (tests/all.rs) instead of one per file: one link, the tests run in parallel.
autotests = false

[features]
# HEIF/HEIC decoding (formats.md §3), off by default: `cargo build -p dalica --features heif`.
heif = ["dep:dalica-image", "dalica-image/heif"]

[dependencies]
dalica-core.workspace = true
# Only to forward the `heif` feature; the app reaches the decoders through the engine.
dalica-image = { workspace = true, optional = true }
# With the camera USB transport (M15.52).
dalica-engine = { workspace = true, features = ["camera-usb"] }
dalica-fs.workspace = true
# The file types of the default-viewer calls (`os`, M15.12).
dalica-scan.workspace = true
dalica-ui.workspace = true
dalica-ui-kit.workspace = true
eframe.workspace = true
egui.workspace = true
getrandom.workspace = true
log.workspace = true
# Native folder dialogs; only the XDG portal backend on Linux (gtk3 links C, architecture.md §1).
rfd = { workspace = true, default-features = false, features = ["xdg-portal"] }
serde_json.workspace = true
wgpu.workspace = true

# The clipboard (`os`, M15.12).
arboard.workspace = true

# Locate on Disk's D-Bus call and the Wayland copy of files (`os`, M15.12).
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs.workspace = true
zbus.workspace = true

# The system menu bar, generated from the menu model (design-system.md §11.1), and the applications
# that open a file (`os`, M15.12).
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
# Finder's and the Dock's open-documents events, for the viewer (`instance`, M15.18).
fmv-macos-events.workspace = true

# The icon and VERSIONINFO of dalica.exe (build.rs; only used when targeting Windows).
[build-dependencies]
winresource.workspace = true

[dev-dependencies]
# Test photos for `dalica --view` (tests/view.rs).
dalica-scenes.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
