[package]
name = "dalica"
description = "Dalica desktop app: the eframe window, the control-server transport, the native menu and the rfd picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# HEIF/HEIC decoding (formats.md §3), off by default: `cargo build -p dalica --features heif`.
heif = ["dep:dalica-image", "dalica-image/heif"]

[dependencies]
dalica-core.workspace = true
# Only to forward the `heif` feature; the app reaches the decoders through the engine.
dalica-image = { workspace = true, optional = true }
dalica-engine.workspace = true
dalica-fs.workspace = true
dalica-ui.workspace = true
dalica-ui-kit.workspace = true
eframe.workspace = true
egui.workspace = true
getrandom.workspace = true
log.workspace = true
# Native folder dialogs; only the XDG portal backend on Linux (gtk3 links C, architecture.md §1).
rfd = { workspace = true, default-features = false, features = ["xdg-portal"] }
serde_json.workspace = true
wgpu.workspace = true

# The system menu bar, generated from the menu model (design-system.md §11.1).
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[dev-dependencies]
tempfile.workspace = true
