[package]
name = "dalica-cli"
description = "Dalica headless CLI: commands, run, inspect, render, snapshot, mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One integration-test binary (`tests/all.rs`, one module per file; `docs/development.md` §6).
autotests = false

[dependencies]
dalica-core.workspace = true
dalica-engine.workspace = true
dalica-fs.workspace = true
# `dalica-cli mcp`: the MCP server over a headless session.
dalica-mcp.workspace = true
dalica-ui.workspace = true
# `mcp`'s logger, to standard error only.
log.workspace = true
png.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test photos for the thumbnail-cache test.
dalica-scenes.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
